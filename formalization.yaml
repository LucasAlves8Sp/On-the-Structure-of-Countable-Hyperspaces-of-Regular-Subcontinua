# formalization.yaml v0.4.
version: "v0.4"

project:
  name: "On the structure of countable hyperspaces of regular subcontinua"
  description: >-
    For a metric continuum X, D(X) is the hyperspace of subcontinua of X that
    are the closure of their interior, with the Hausdorff metric. The project
    formalizes the theorem that a countable D(X) is a G-delta subset of the
    hyperspace of subcontinua, hence completely metrizable and scattered with
    dense isolated points, so that D(X) is never homeomorphic to the
    rationals; together with the structure theory behind it (independent
    families, blister theorem, complement lemma, absorption by minimal
    elements, decreasing intersections, density of minimal elements, D-atomic
    continua, the cardinality dichotomy).
  authors:
    - "Lucas Alves de Almeida"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lucas Alves de Almeida"

