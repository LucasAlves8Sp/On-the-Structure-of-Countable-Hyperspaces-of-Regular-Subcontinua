related_formalizations: []

status:
  scope: >-
    Formalized: every numbered lemma, proposition, theorem and corollary of
    Sections 1 and 3 to 6 of the manuscript, and Proposition 7.5; that is,
    Theorems 1.2, 1.4, 1.5, 3.4, 4.4, 5.1, Lemmas 3.2, 4.1, 4.6, 6.2,
    Propositions 4.3, 6.3, 7.5, Corollaries 4.5, 6.5, with the hypotheses of
    the manuscript and no additional one. NOT formalized: Examples 7.1, 7.2
    and 7.3 (7.3 is a new example of the manuscript), all remarks, and the
    preliminary Lemmas 2.3 and 2.4 as stated (the Lean proofs do not use
    boundary bumping and treat components differently). The manuscript as a
    whole is therefore only partially formalized. See docs/CORRESPONDENCE.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude Fable 5.2"]
      framework: "Claude (Anthropic) agent session with a shell"
      tool_setup: >-
        All Lean code was written by the model. The proof modules were first
        written without compiler feedback, with Mathlib names checked by text
        search of the Mathlib source at tag v4.35.0-rc2, and then compiled and
        repaired with lake build. Mathlib was built from source because the
        Mathlib cache server was not reachable.
      cost:
        wall_time: "about three hours on 2026-11-11, of which about one hour building Mathlib"
        spend_usd: "not tracked"
        hardware: "cloud container"
      prompting_notes: >-
        The human author supplied a master prompt requiring the manuscript's
        exact hypotheses, no sorry or extra axioms, standalone Comparator
        targets for Lemma 4.6 and Theorem 5.1, and an explicit report of
        anything left unformalized.
  spend_usd: "not tracked"
  notes: >-
    According to the author's declaration in the manuscript, the models
    involved in obtaining the mathematical results were Opus 5.5, Fable 5.2
    and ChatGPT-Astra: Fable 5.2 carried out the main research, ChatGPT-Astra
    rechecked the arguments, compared them with the literature and re-derived
    the results, and the author directed the investigation and edited and
    checked the text. The prompt that started the research is in
    docs/research-prompt.md. The
    Lean statements and proofs were produced by Fable 5.2 in one agent
    session. The human author has not written or reviewed Lean code.

fidelity:
  divergences: >-
    (1) Regular subcontinua are handled as subsets of X satisfying a
    predicate; isRegSubcontinuum_iff_exists_mem_regular ties the predicate to
    the hyperspace. (2) C(X) is a subtype of Mathlib's NonemptyCompacts X with
    the Vietoris topology, which Mathlib identifies by construction with the
    topology of the Hausdorff metric. (3) Components are
    connectedComponentIn. (4) Proposition 4.3 (2) keeps the countability
    hypothesis of the source although the proof does not need it, and drops
    the hypothesis that F is nonempty. (5) Corollary 6.5 ("exactly one") is
    split into dichotomy and dichotomy_exclusive. (6) Proposition 7.5 is
    stated with a strictly monotone map from the rationals. (7) Cardinality
    statements are about the type of points of regular X. No other divergence
    is known.

review:
  status: "self-assessed by the AI system that wrote the code; no human review"
  reviewers:
    - "none"
  notes: >-
    The manuscript's proofs were re-derived by an AI system before the
    statements were written (docs/AUDIT.md), and the compiled statements were
    read back against the manuscript by the same system. No human referee has
    examined the manuscript and no human has audited the Lean statements.
    scripts/verify-comparator.sh, as shipped and sandboxed, accepted the
    solution in GitHub Actions on commit 49a57d8 (Lean kernel, nanoda,
    con-ron), on a fresh checkout. Local runs of lake comparator, including
    --paranoid, also accepted it but were made without the sandbox.

alignment:
  namespace: "RegularSubcontinua"
  statements:
    - source: "Theorem 1.2 (Main Theorem), first part"
      lean: "RegularSubcontinua.main_theorem"
      module: "Solution"
      status: "proved"
      note: "D(X) countable implies: G-delta in C(X), completely metrizable, scattered, isolated points dense."
    - source: "Theorem 1.2, last assertion"
      lean: "RegularSubcontinua.not_homeomorphic_rat"
      module: "Solution"
      status: "proved"
      note: "For every metric continuum X there is no homeomorphism between D(X) and the rationals."
    - source: "Theorem 1.2, last assertion, continuum quantified"
      lean: "RegularSubcontinua.no_continuum_with_regular_hyperspace_rat"
      module: "Solution"
      status: "proved"
      note: "Same assertion with X bound by an existential quantifier."
    - source: "Theorem 1.4 (Structure Theorem)"
      lean: "RegularSubcontinua.structure_theorem"
      module: "Solution"
      status: "proved"
      note: "Parts (1) to (4)."
    - source: "Theorem 1.5"
      lean: "RegularSubcontinua.isGdelta_regular_of_isDAtomic"
      module: "Solution"
      status: "proved"
      note: "D-atomic implies D(X) is G-delta in C(X)."
    - source: "Lemma 3.2 (independent families)"
